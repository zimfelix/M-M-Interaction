<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growbox 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.42.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #f4f3ef;
    --stage: #ebe9e3;
    --panel: #ffffff;
    --text: #1d1d1b;
    --muted: #6d6b67;
    --border: rgba(0, 0, 0, 0.12);
    --hover: rgba(0, 0, 0, 0.05);
    --accent: #2a78d6;
    --ok-bg: #d5eed3;  --ok-fg: #006300;
    --rec-bg: #fad6d6; --rec-fg: #8e2626;
    --warn: #a66a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131313;
      --stage: #1c1c1b;
      --panel: #20201f;
      --text: #f0efec;
      --muted: #a5a49a;
      --border: rgba(255, 255, 255, 0.12);
      --hover: rgba(255, 255, 255, 0.06);
      --ok-bg: #11260f;  --ok-fg: #73cb6d;
      --rec-bg: #3c0e0e; --rec-fg: #ec7e7e;
      --warn: #db9300;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* 3D-Bühne */
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--stage);
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .badge {
    position: absolute;
    top: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    visibility: hidden;
  }
  #live { left: 12px;  background: var(--rec-bg); color: var(--rec-fg); }
  #sens { right: 12px; background: var(--ok-bg);  color: var(--ok-fg); }

  .info {
    position: absolute;
    left: 12px; right: 12px; bottom: 12px;
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.5;
    visibility: hidden;
  }
  .info i { color: var(--warn); }

  /* Bedienleiste unten */
  #bar {
    flex: none;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #buttons {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (max-width: 640px) {
    #buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover  { background: var(--hover); }
  button:active { transform: scale(0.98); }
  button i { font-size: 18px; }
  #hint {
    max-width: 900px;
    margin: 8px auto 0;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<main id="stage" aria-label="Drehbares 3D-Modell der Growbox">
  <div id="live" class="badge">LIVE · Kamera</div>
  <div id="sens" class="badge">Hand erkannt · Display an</div>
  <div id="ledinfo" class="info">
    <i class="ti ti-bulb" aria-hidden="true"></i>
    LED-Streifen liegt in einer Nut im oberen Rahmen, vorne und hinten von einer Wand abgeschirmt.
    Er strahlt nur nach unten auf die Pilze, man sieht ihn von keiner Seite und er blendet nicht.
  </div>
</main>

<footer id="bar">
  <div id="buttons">
    <button id="zoom"><i class="ti ti-zoom-in" aria-hidden="true"></i><span>Bedienfeld zeigen</span></button>
    <button id="hand"><i class="ti ti-hand-stop" aria-hidden="true"></i><span>Hand davorhalten</span></button>
    <button id="led"><i class="ti ti-toggle-right" aria-hidden="true"></i><span>Schalter: an</span></button>
    <button id="ledv"><i class="ti ti-bulb" aria-hidden="true"></i><span>LED-Nut zeigen</span></button>
    <button id="door"><i class="ti ti-door" aria-hidden="true"></i><span>Tür öffnen</span></button>
    <button id="slide"><i class="ti ti-droplet" aria-hidden="true"></i><span>Schieber öffnen</span></button>
    <button id="pov"><i class="ti ti-camera" aria-hidden="true"></i><span>Kamerabild</span></button>
    <button id="reset"><i class="ti ti-refresh" aria-hidden="true"></i><span>Ansicht</span></button>
  </div>
  <p id="hint">Ziehen zum Drehen · Display geht nach ein paar Sekunden wieder aus</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Grundgerüst ---------- */
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(20, 40, 30); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-30, 10, -10); scene.add(fill);

const root = new THREE.Group(); scene.add(root);
const box = new THREE.Group(); box.position.set(-13.75, 0, 0); root.add(box);

/* ---------- Materialien ---------- */
const pla    = new THREE.MeshStandardMaterial({ color: 0x2c2d30, roughness: 0.75 });

const metal  = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.6, roughness: 0.4 });

function B(w, h, d, x, y, z, m, parent) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z);
  (parent || box).add(o);
  return o;
}

/* ---------- Pilzkammer (20 × 20 × 20 cm) ---------- */
const t = 1.2;
B(20, 5, t, 10, 2.5, 10 - t/2, pla);  B(20, 1, 20, 10, 0.5, 0, pla);
B(20, 5, t, 10, 2.5, -10 + t/2, pla); B(t, 5, 20, t/2, 2.5, 0, pla);
B(t, 20, t, t/2, 10, 10 - t/2, pla);  B(t, 20, t, 20 - t/2, 10, 10 - t/2, pla);
B(t, 20, t, t/2, 10, -10 + t/2, pla); B(t, 20, t, 20 - t/2, 10, -10 + t/2, pla);
B(20, t, t, 10, 20 - t/2, 10 - t/2, pla); B(20, t, t, 10, 20 - t/2, -10 + t/2, pla);
B(t, t, 20, t/2, 20 - t/2, 0, pla);   B(t, t, 20, 20 - t/2, 20 - t/2, 0, pla);
B(t, t, 20, t/2, 5, 0, pla);          B(20, t, t, 10, 5, -10 + t/2, pla);
B(0.3, 13.8, 17.6, 0.6, 12.4, 0, glass);
B(17.6, 13.8, 0.3, 10, 12.4, -9.6, glass);
B(17.6, 0.3, 17.6, 10, 19.75, 0, glass);
B(17.6, 3.4, 17.6, 10, 2.7, 0, new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 1 }));

const capM  = new THREE.MeshStandardMaterial({ color: 0xe8d6b8, roughness: 0.8 });

[[6,2,1.6],[9,-2,2.2],[12.5,3,1.4],[14,-4,1.8],[7.5,-5,1.2],[11,5.5,1.1]].forEach(([x, z, s]) => {
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.25*s, 0.3*s, 2.2*s, 12), stemM);
  st.position.set(x, 4.4 + 1.1*s, z); box.add(st);

});

/* ---------- LED-Streifen in der Nut ---------- */
const ledM   = new THREE.MeshStandardMaterial({ color: 0xfff1d6, emissive: 0xffcf80, emissiveIntensity: 1.4 });
const stripM = new THREE.MeshStandardMaterial({ color: 0xf1efe8, roughness: 0.6 });
const padM   = new THREE.MeshStandardMaterial({ color: 0xd08a5c, roughness: 0.6 });
const pxG = new THREE.BoxGeometry(0.34, 0.12, 0.34), padG = new THREE.BoxGeometry(0.14, 0.04, 0.14);
[[9.4, 8.72, 9.98], [-9.4, -8.72, -9.98]].forEach(([zb, zl, zo]) => {

    const p = new THREE.Mesh(padG, padM); p.position.set(x + 0.36, 18.73, zb + 0.18); box.add(p);

  B(17.6, 0.7, 0.16, 10, 18.45, zo, pla);
});
const ledLight = new THREE.PointLight(0xffc870, 1.1, 30);
ledLight.position.set(10, 16.5, 0); box.add(ledLight);

/* ---------- Kamera hinten rechts ---------- */
const camMount = new THREE.Group(); camMount.position.set(18.2, 17.4, -7.4); box.add(camMount);
B(1.6, 1.6, 1.6, 0.4, 0.4, -0.4, pla, camMount);
const cg = new THREE.Group(); camMount.add(cg);
B(1.5, 1.3, 1.6, 0, 0, 0, new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.4 }), cg);
const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.4, 24), new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.8, roughness: 0.15 }));
lens.rotation.x = Math.PI/2; lens.position.z = 0.95; cg.add(lens);
const lensGlass = new THREE.Mesh(new THREE.CircleGeometry(0.3, 24), new THREE.MeshStandardMaterial({ color: 0x2a3a6a, metalness: 0.9, roughness: 0.05 }));

const recDot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
recDot.position.set(0.5, 0.42, 0.82); cg.add(recDot);
const povCam = new THREE.PerspectiveCamera(70, 1, 0.2, 100);
povCam.position.z = 1.3; povCam.rotation.y = Math.PI; cg.add(povCam);

/* ---------- Glastür ---------- */
const doorPivot = new THREE.Group(); doorPivot.position.set(0, 0, 10); box.add(doorPivot);
B(20, 15, 0.3, 10, 12.5, 0.25, glass, doorPivot);
B(20, 0.8, 0.5, 10, 19.6, 0.3, pla, doorPivot); B(20, 0.8, 0.5, 10, 5.4, 0.3, pla, doorPivot);
B(0.8, 15, 0.5, 0.4, 12.5, 0.3, pla, doorPivot); B(0.8, 15, 0.5, 19.6, 12.5, 0.3, pla, doorPivot);
const doorHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 8, 16), handle);
doorHandle.position.set(18.3, 12.5, 1.6); doorPivot.add(doorHandle);
B(0.4, 0.4, 1.2, 18.3, 16, 1, handle, doorPivot); B(0.4, 0.4, 1.2, 18.3, 9, 1, handle, doorPivot);

/* ---------- Technikraum mit Wassertank ---------- */
const tx = 20, tw = 7.5, cx = tx + tw/2, w = 0.8, ty = 13, split = -0.5;
const inW = tw - 2*w, tankD = 10 + split - w, tz = (-10 + w + split) / 2;
B(tw, ty, 20, cx, ty/2, 0, pla);
B(tw, 20 - ty, 10 - split, cx, ty + (20 - ty)/2, (10 + split)/2, pla);
B(tw, 19.2 - ty, w, cx, ty + (19.2 - ty)/2, -10 + w/2, pla);
B(w, 20 - ty, 10 + split, tx + w/2, ty + (20 - ty)/2, (-10 + split)/2, pla);
B(w, 20 - ty, 10 + split, tx + tw - w/2, ty + (20 - ty)/2, (-10 + split)/2, pla);
B(inW, 0.05, tankD, cx, ty + 0.03, tz, plaIn);
B(inW - 0.2, 4.2, tankD - 0.2, cx, ty + 2.1, tz, water);
const fog = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.4, 20), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.5 }));
fog.position.set(cx, ty + 0.3, -5); box.add(fog);
B(0.3, 0.3, 10, tx + w + 0.15, 19.1, tz, metal); B(0.3, 0.3, 10, tx + tw - w - 0.15, 19.1, tz, metal);
const slider = new THREE.Group(); box.add(slider);
const sLen = 10 + split;
B(inW - 0.1, 0.6, sLen, cx, 19.6, -10 + sLen/2, pla, slider);
B(3, 0.5, 0.8, cx, 20.15, -9.2, handle, slider); B(3, 0.15, 0.4, cx, 20.45, -9.4, handle, slider);
for (let i = 0; i < 5; i++) B(0.25, 8, 0.2, tx - 0.05, 10, -6 + i*2.2, plaIn);

/* ---------- iPhone-Bedienfeld ---------- */
B(6.46, 13.19, 0.2, cx, 11.7, 10.02, plaIn);
const phone = new THREE.Group(); phone.position.set(cx, 11.7, 10.15); box.add(phone);
B(6.42, 13.15, 0.25, 0, 0, 0, new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.3, metalness: 0.4 }), phone);

const SC = 2, screen = document.createElement('canvas');
screen.width = 512*SC; screen.height = 1084*SC;
const c = screen.getContext('2d'); c.scale(SC, SC);
const F = '-apple-system,"Segoe UI",Roboto,sans-serif';
function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }
(function drawScreen() {
  const g = c.createRadialGradient(256, 470, 40, 256, 470, 640);
  g.addColorStop(0, '#2f4bff'); g.addColorStop(1, '#0a14a8');
  c.fillStyle = g; c.fillRect(0, 0, 512, 1084);
  c.fillStyle = '#000'; rr(160, -10, 192, 44, 18); c.fill();
  // Kopfzeile
  c.fillStyle = '#fff'; c.textAlign = 'left'; c.font = '800 34px ' + F; c.fillText('AUSTER', 30, 118);
  c.strokeStyle = 'rgba(255,255,255,0.45)'; c.lineWidth = 2.5; c.beginPath(); c.arc(256, 106, 30, 0, 7); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.12)'; c.strokeStyle = 'rgba(255,255,255,0.6)';
  rr(372, 76, 60, 60, 12); c.fill(); c.stroke(); rr(442, 76, 60, 60, 12); c.fill(); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 3; rr(392, 91, 20, 30, 4); c.stroke();
  c.beginPath(); c.moveTo(399, 116); c.lineTo(405, 116); c.stroke();
  c.beginPath(); c.arc(472, 106, 8, 0, 7); c.stroke();
  for (let i = 0; i < 8; i++) { const a = i*Math.PI/4; c.beginPath(); c.moveTo(472 + Math.cos(a)*12, 106 + Math.sin(a)*12); c.lineTo(472 + Math.cos(a)*17, 106 + Math.sin(a)*17); c.stroke(); }
  // Ring + Pilz
  c.strokeStyle = 'rgba(140,160,255,0.45)'; c.lineWidth = 14; c.beginPath(); c.arc(256, 405, 172, 0, 7); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 7; c.beginPath(); c.arc(256, 405, 160, 0, 7); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(256, 245, 19, 0, 7); c.fill();
  c.save(); c.translate(98, 432); c.rotate(-0.3); c.fillStyle = '#e8d45a'; c.fillRect(-6, -4, 13, 8); c.restore();
  c.fillStyle = 'rgba(140,160,255,0.55)';
  [[202, 402], [310, 402]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 6, 0, Math.PI); c.lineTo(x, y - 12); c.closePath(); c.fill(); });
  c.fillStyle = '#c3cad6'; c.beginPath(); c.ellipse(256, 355, 86, 62, 0, Math.PI, 0); c.closePath(); c.fill();
  c.fillStyle = '#f3ece0'; c.beginPath(); c.moveTo(236, 355); c.lineTo(276, 355); c.lineTo(280, 412); c.lineTo(232, 412); c.closePath(); c.fill();
  c.strokeStyle = '#14214f'; c.lineWidth = 3.5; c.beginPath(); c.arc(256, 372, 10, 0.25, Math.PI - 0.25); c.stroke();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 92px ' + F; c.fillText('Jetzt', 256, 508);
  c.font = '500 22px ' + F; c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillText('E R N T E N', 256, 546);
  // Status
  c.fillStyle = '#2bb673'; c.beginPath(); c.arc(158, 672, 24, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = '#0b2a3a'; c.lineWidth = 5; c.beginPath(); c.moveTo(146, 672); c.lineTo(155, 681); c.lineTo(171, 663); c.stroke();
  c.fillStyle = '#fff'; c.font = '800 46px ' + F; c.textAlign = 'left'; c.fillText('Alles gut', 194, 688);
  // Button
  c.strokeStyle = '#fff'; c.lineWidth = 3; rr(28, 742, 456, 80, 16); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(148, 778, 16, 11, 0, Math.PI, 0); c.closePath(); c.fill(); c.fillRect(144, 778, 8, 14);
  c.font = '700 27px ' + F; c.fillText('Geerntet? Neue Sorte', 176, 792);
  // Messwerte
  [[28, '21,3°', 'Temperatur'], [200, '91 %', 'Luftfeuchte'], [372, '63 % · 4 T', 'Wassertank']].forEach(([x, v, l], i) => {
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 2.5;
    if (i === 0) { rr(x + 3, 846, 8, 20, 4); c.stroke(); c.beginPath(); c.arc(x + 7, 870, 6, 0, 7); c.stroke(); }
    if (i === 1) { c.beginPath(); c.moveTo(x + 8, 846); c.quadraticCurveTo(x + 16, 860, x + 14, 866); c.arc(x + 8, 864, 6, 0.3, Math.PI - 0.3); c.quadraticCurveTo(x, 860, x + 8, 846); c.stroke(); }
    if (i === 2) { rr(x + 1, 850, 16, 16, 3); c.stroke(); c.beginPath(); c.moveTo(x + 1, 857); c.lineTo(x + 17, 857); c.stroke(); }
    c.font = '700 26px ' + F; c.textAlign = 'left'; c.fillText(v, x + 26, 870);
    c.fillStyle = 'rgba(255,255,255,0.22)'; rr(x, 888, 140, 8, 4); c.fill();
    if (i === 2) { c.fillStyle = '#fff'; rr(x, 888, 140*0.63, 8, 4); c.fill(); }
    else {
      const p = i === 0 ? 0.45 : 0.85;
      c.fillStyle = 'rgba(255,255,255,0.45)'; rr(x + 140*p - 22, 888, 44, 8, 4); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x + 140*p, 892, 11, 0, 7); c.fill();
    }
    c.fillStyle = 'rgba(255,255,255,0.9)'; c.font = '600 19px ' + F; c.fillText(l, x, 926);
  });
  // Kacheln
  [['KLIMA', 'Auto'], ['MELDUNGEN', ''], ['SORTEN', 'Neu?']].forEach(([a, b], i) => {
    const x = 28 + i*158, y = 956, wT = 140, hT = 112, ix = x + wT/2, iy = y + 34;
    c.fillStyle = 'rgba(255,255,255,0.08)'; rr(x, y, wT, hT, 14); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#fff'; c.strokeStyle = '#fff';
    if (i === 0) {
      rr(ix - 6, iy - 20, 12, 28, 6); c.stroke(); c.beginPath(); c.arc(ix, iy + 13, 9, 0, 7); c.stroke();
      c.beginPath(); [-12, -4].forEach(d => { c.moveTo(ix + 11, iy + d); c.lineTo(ix + 20, iy + d); c.moveTo(ix - 11, iy + d); c.lineTo(ix - 20, iy + d); }); c.stroke();
    }
    if (i === 1) {
      c.fillStyle = '#dfe4ff'; c.beginPath(); c.moveTo(ix - 16, iy + 10); c.quadraticCurveTo(ix - 16, iy - 20, ix, iy - 20); c.quadraticCurveTo(ix + 16, iy - 20, ix + 16, iy + 10); c.closePath(); c.fill();
      c.fillRect(ix - 20, iy + 8, 40, 4); c.beginPath(); c.arc(ix, iy + 17, 5, 0, Math.PI); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(x + wT - 6, y + 4, 16, 0, 7); c.fill();
      c.fillStyle = '#1428c8'; c.font = '800 18px ' + F; c.textAlign = 'center'; c.fillText('1', x + wT - 6, y + 11);
    }
    if (i === 2) { c.fillStyle = '#dfe4ff'; c.beginPath(); c.ellipse(ix, iy + 2, 26, 18, 0, Math.PI, 0); c.closePath(); c.fill(); c.fillStyle = '#fff'; rr(ix - 5, iy + 2, 10, 18, 3); c.fill(); }
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = '800 21px ' + F;
    if (b) {
      c.fillText(a, ix, y + 82); c.font = '600 17px ' + F; c.fillStyle = 'rgba(255,255,255,0.9)';
      if (i === 0) { c.fillText(b, ix + 8, y + 103); c.fillStyle = '#2bb673'; c.beginPath(); c.arc(ix - 22, y + 97, 6, 0, 7); c.fill(); }
      else c.fillText(b, ix, y + 103);
    } else c.fillText(a, ix, y + 90);
  });
})();
const tex = new THREE.CanvasTexture(screen);
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const screenM = new THREE.MeshBasicMaterial({ map: tex, color: 0x060606 });
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 12.7), screenM);
screenMesh.position.z = 0.13; phone.add(screenMesh);

/* ---------- Handsensor + Schiebeschalter ---------- */
const sy = 4.6, wy = 2.2;
B(6.46, 0.95, 0.27, cx, sy, 10.14, new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.08, metalness: 0.55 }));
[-1.6, 1.6].forEach(x => {
  const l = new THREE.Mesh(new THREE.CircleGeometry(0.22, 20), new THREE.MeshStandardMaterial({ color: 0x3a0c10, roughness: 0.05, metalness: 0.6 }));
  l.position.set(cx + x, sy, 10.285); box.add(l);
});
const sensorDotM = new THREE.MeshBasicMaterial({ color: 0x0b2a1f });
const sensorDot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8), sensorDotM);
sensorDot.position.set(cx, sy, 10.29); box.add(sensorDot);
B(2.4, 1.2, 0.3, cx, wy, 10.15, new THREE.MeshStandardMaterial({ color: 0x101012, roughness: 0.5 }));
const trackM = new THREE.MeshStandardMaterial({ color: 0x1d9e75, roughness: 0.5 });
B(1.9, 0.7, 0.1, cx, wy, 10.33, trackM);
const knob = B(0.8, 0.8, 0.35, cx + 0.5, wy, 10.45, new THREE.MeshStandardMaterial({ color: 0xf1efe8, roughness: 0.4 }));

/* ---------- Hand für die Sensor-Demo ---------- */
const skin = new THREE.MeshStandardMaterial({ color: 0xd9a77f, roughness: 0.8 });
const hand = new THREE.Group(); hand.visible = false; box.add(hand);
B(4.2, 4.6, 1, 0, 0, 0, skin, hand);
[-1.55, -0.52, 0.52, 1.55].forEach((x, i) => {
  const L = [3.2, 3.7, 3.5, 2.8][i];
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.45, L, 12), skin);
  f.position.set(x, 2.3 + L/2, 0); hand.add(f);
});
const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 2.6, 12), skin);
thumb.rotation.z = 1.0; thumb.position.set(-3, 0.4, 0); hand.add(thumb);
const wrist = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.9, 5, 16), skin);
wrist.position.set(0, -4.6, 0); wrist.scale.z = 0.5; hand.add(wrist);

/* ---------- Kamera-Ansichten ---------- */
const views = {
  far:  { p: new THREE.Vector3(0, 14, 52), l: new THREE.Vector3(0, 9.5, 0) },
  near: { p: new THREE.Vector3(10, 10, 28), l: new THREE.Vector3(10, 9.5, 0) },
  led:  { p: new THREE.Vector3(-1, 9.5, -5), l: new THREE.Vector3(-4.5, 18.7, 9.4) }
};
let camT = views.far;
const camPos = views.far.p.clone(), camLook = views.far.l.clone();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  cam.aspect = povCam.aspect = aspect;
  cam.updateProjectionMatrix(); povCam.updateProjectionMatrix();
  // Abstand so wählen, dass die Box die Bühne gut füllt
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const d = Math.max(13 / tanHalf, 18 / (tanHalf * aspect)) * 1.25;
  views.far.p.set(0, 9.5 + d * 0.22, d);
  views.near.p.set(10, 10, Math.max(22, 9 / (tanHalf * Math.min(aspect, 1)) ));
}
window.addEventListener('resize', resize);
resize();
camPos.copy(views.far.p);

/* ---------- Drehen per Ziehen ---------- */
let rotY = -0.6, rotX = 0.22, tY = rotY, tX = rotX, auto = true, drag = false, px = 0, py = 0;
stage.addEventListener('pointerdown', e => { drag = true; auto = false; px = e.clientX; py = e.clientY; stage.setPointerCapture(e.pointerId); stage.classList.add('dragging'); });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  tY += (e.clientX - px) * 0.01;
  tX = Math.max(-0.3, Math.min(0.9, tX + (e.clientY - py) * 0.006));
  px = e.clientX; py = e.clientY;
});
stage.addEventListener('pointerup', () => { drag = false; stage.classList.remove('dragging'); });

/* ---------- Zustand + Buttons ---------- */
let doorOpen = false, doorA = 0, sliderOpen = false, sliderZ = 0, lightOn = true, knobX = 0.5;
let zoomed = false, pov = false, ledView = false, tick = 0, handT = -1, awake = 0, bright = 0;

function setBtn(id, icon, label) { $(id).innerHTML = `<i class="ti ${icon}" aria-hidden="true"></i><span>${label}</span>`; }
function updateZoom() { setBtn('zoom', zoomed ? 'ti-zoom-out' : 'ti-zoom-in', zoomed ? 'Ganze Box' : 'Bedienfeld zeigen'); }
function updatePov()  { setBtn('pov', pov ? 'ti-camera-off' : 'ti-camera', pov ? 'Außenansicht' : 'Kamerabild'); $('live').style.visibility = pov ? 'visible' : 'hidden'; }
function setLedView(v) {
  ledView = v;
  setBtn('ledv', v ? 'ti-arrow-back-up' : 'ti-bulb', v ? 'Zurück' : 'LED-Nut zeigen');
  $('ledinfo').style.visibility = v ? 'visible' : 'hidden';
}
function defaultView() { camT = views.far; tY = -0.6; tX = 0.22; auto = true; }

$('zoom').onclick = () => {
  setLedView(false); zoomed = !zoomed; camT = zoomed ? views.near : views.far;
  if (zoomed) { auto = false; tY = 0; tX = 0; pov = false; updatePov(); awake = Math.max(awake, 360); }
  updateZoom();
};
$('hand').onclick = () => {
  setLedView(false); handT = 0; hand.visible = true; pov = false; updatePov();
  zoomed = true; camT = views.near; auto = false; tY = 0.35; tX = 0.05; updateZoom();
};
$('led').onclick = () => {
  lightOn = !lightOn;
  ledLight.intensity = lightOn ? 1.1 : 0;
  ledM.emissiveIntensity = lightOn ? 1.4 : 0;
  ledM.color.setHex(lightOn ? 0xfff1d6 : 0xbbbbbb);
  trackM.color.setHex(lightOn ? 0x1d9e75 : 0x444441);
  setBtn('led', lightOn ? 'ti-toggle-right' : 'ti-toggle-left', lightOn ? 'Schalter: an' : 'Schalter: aus');
};
$('ledv').onclick = () => {
  const v = !ledView; setLedView(v); pov = false; updatePov(); zoomed = false; updateZoom();
  if (v) { camT = views.led; auto = false; tY = 0; tX = 0; if (!lightOn) $('led').onclick(); }
  else defaultView();
};
$('door').onclick = () => { doorOpen = !doorOpen; setBtn('door', 'ti-door', doorOpen ? 'Tür schließen' : 'Tür öffnen'); };
$('slide').onclick = () => {
  sliderOpen = !sliderOpen; setBtn('slide', 'ti-droplet', sliderOpen ? 'Schieber schließen' : 'Schieber öffnen');
  if (sliderOpen) { setLedView(false); camT = views.far; auto = false; tX = 0.6; }
};
$('pov').onclick = () => { setLedView(false); pov = !pov; updatePov(); };
$('reset').onclick = () => { setLedView(false); zoomed = false; pov = false; defaultView(); updateZoom(); updatePov(); };

/* ---------- Animation ---------- */
function loop() {
  tick++;
  recDot.visible = Math.floor(tick / 40) % 2 === 0;
  if (auto && !pov) tY += 0.003;
  rotY += (tY - rotY) * 0.12; rotX += (tX - rotX) * 0.12;
  root.rotation.set(rotX, rotY, 0);

  camPos.lerp(camT.p, 0.08); camLook.lerp(camT.l, 0.08);
  cam.position.copy(camPos); cam.lookAt(camLook);

  doorA += ((doorOpen ? 1.9 : 0) - doorA) * 0.08; doorPivot.rotation.y = -doorA;
  sliderZ += ((sliderOpen ? -7.5 : 0) - sliderZ) * 0.08; slider.position.z = sliderZ;
  knobX += ((lightOn ? 0.5 : -0.5) - knobX) * 0.25; knob.position.x = cx + knobX;

  let near = false;
  if (handT >= 0) {
    handT++;
    let p = handT < 70 ? handT / 70 : handT < 150 ? 1 : 1 - (handT - 150) / 70;
    p = Math.max(0, p);
    const e = p * p * (3 - 2 * p);
    hand.position.set(cx + 0.6, 5.6, 26 - e * 11.5);
    near = e > 0.8;
    if (handT > 220) { handT = -1; hand.visible = false; }
  }
  if (near) awake = 280; else if (awake > 0) awake--;
  sensorDotM.color.setHex(near ? 0x5dcaa5 : 0x0b2a1f);
  $('sens').style.visibility = awake > 0 ? 'visible' : 'hidden';
  bright += ((awake > 0 ? 1 : 0.02) - bright) * 0.1;
  screenM.color.setScalar(bright);

  renderer.render(scene, pov ? povCam : cam);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
