<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedienfeld auf iPhone 13 mini</title>
<style>
  :root { --bg: #e9ebe6; --fg: #2a2c28; --muted: #62665e; --sheet: #0c1585; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  p { margin: 0; color: var(--muted); text-align: center; max-width: 640px; }
  a { color: inherit; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .modes button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid #b9bdb4; background: #fff; color: var(--fg); cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  .row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-weight: 600; text-align: center; }
  figcaption small { display: block; font-weight: 400; color: var(--muted); }

  /* iPhone 13 mini: Bildschirm 375 × 812 Punkte */
  .phone { padding: 12px; border-radius: 54px; background: #0b0b0c; box-shadow: 0 0 0 2px #3a3b3e, 0 20px 50px rgba(0,0,0,.25); }
  .screen { position: relative; width: 375px; height: 812px; border-radius: 44px; overflow: hidden; background: #000; }
  iframe { position: absolute; left: 0; width: 375px; border: 0; display: block; background: #fff; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 156px; height: 32px; background: #0b0b0c; border-radius: 0 0 20px 20px; z-index: 3; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 3; }

  /* Statusleiste: hell (Safari) oder schwarz (claude.ai-Ansicht) */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 51px; display: flex; align-items: center; justify-content: space-between;
            padding: 8px 26px 0 30px; box-sizing: border-box; font-weight: 600; font-size: 16px; color: #000; background: #f2f2f7; z-index: 2; }
  .status .l { display: flex; flex-direction: column; line-height: 1.1; }
  .status .l small { font-size: 11px; font-weight: 500; }
  .status .r { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 3.5px; position: relative; }
  .bat::after { content: ""; position: absolute; inset: 1.5px; right: 6px; background: currentColor; border-radius: 1px; }
  .claude .status { background: #000; color: #fff; }

  /* Safari: Adressleiste unten */
  .safari { position: absolute; left: 0; right: 0; bottom: 0; height: 98px; background: #f2f2f7; border-top: 1px solid #d1d1d6; }
  .safari .bar { margin: 8px 14px 0; height: 40px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
                 display: flex; align-items: center; justify-content: center; font-size: 14px; color: #000; }

  /* claude.ai-Ansicht (Link aus WhatsApp o. Ä.): Blatt mit runden Ecken, Kopf mit ✕ und ⋯, unten Sicherheitsabstand */
  .sheet { position: absolute; top: 51px; left: 0; right: 0; height: 69px; background: var(--sheet); border-radius: 26px 26px 0 0;
           display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; z-index: 1; }
  .sheet span { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.14); box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset;
                display: grid; place-items: center; color: #fff; font-size: 20px; line-height: 1; }
  .sheet-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: #08106c; }
  .claude .home { background: rgba(255,255,255,.75); }
  .full .home { background: rgba(255,255,255,.6); }
  [hidden] { display: none !important; }
  /* auf kleinen Bildschirmen verkleinern */
  @media (max-width: 440px) { .phone { zoom: .86; } }
</style>
</head>
<body>
  <h1>Bedienfeld auf dem iPhone 13 mini</h1>
  <div class="modes" role="group" aria-label="Ansicht">
    <button type="button" data-mode="claude" aria-pressed="true">claude.ai-Link (wie auf dem iPhone)</button>
    <button type="button" data-mode="safari" aria-pressed="false">In Safari</button>
    <button type="button" data-mode="full" aria-pressed="false">Vollbild in der Box</button>
  </div>
  <p id="hint"></p>
  <p>Ältere Stände (v1–v3, Original von claude.ai) liegen im Archiv <code>verlauf/</code>.</p>
  <div class="row">
    <figure>
      <figcaption>Aktuell (v4)<small>index.html · Klima-Automatik sichtbar</small></figcaption>
      <div class="phone"><div class="screen" data-src="index.html"></div></div>
    </figure>
  </div>
  <script>
    // Maße in Punkten, aus einem Screenshot vom iPhone 13 mini (375 × 812) abgemessen bzw. ca.
    const MODES = {
      claude: { top: 120, bottom: 34, hint: "So sieht es aus, wenn du den claude.ai-Link auf dem iPhone öffnest (z. B. aus WhatsApp): Seite ca. 375 × 658 unter dem claude.ai-Kopf." },
      safari: { top: 51,  bottom: 98, hint: "Im normalen Safari-Tab: sichtbarer Bereich ca. 375 × 663." },
      full:   { top: 51,  bottom: 34, hint: "Vollbild ohne Leisten (Web-App bzw. Geführter Zugriff), so wie es in der Box hängen soll: ca. 375 × 727." },
    };
    const screens = [...document.querySelectorAll(".screen")];
    for (const sc of screens) {
      sc.innerHTML = `<iframe title="Bedienfeld"></iframe>
        <div class="status"><span class="l">12:15<small>◀ WhatsApp</small></span><span class="r">LTE <span class="bat"></span></span></div>
        <div class="notch"></div>
        <div class="sheet"><span aria-hidden="true">✕</span><span aria-hidden="true">⋯</span></div>
        <div class="sheet-bottom"></div>
        <div class="safari"><div class="bar">🔒 claude.ai</div></div>
        <div class="home"></div>`;
      sc.querySelector("iframe").src = sc.dataset.src + "?v=" + Date.now();  // immer den aktuellen Stand laden, nicht den Cache
    }
    function show(mode) {
      const m = MODES[mode];
      for (const sc of screens) {
        const f = sc.querySelector("iframe");
        f.style.top = m.top + "px";
        f.style.height = (812 - m.top - m.bottom) + "px";
        sc.querySelector(".status").hidden = mode === "full";
        sc.querySelector(".status small").hidden = mode !== "claude";
        sc.querySelector(".sheet").hidden = mode !== "claude";
        sc.querySelector(".sheet-bottom").hidden = mode !== "claude";
        sc.querySelector(".safari").hidden = mode !== "safari";
        sc.classList.toggle("claude", mode === "claude");
        sc.classList.toggle("full", mode === "full");
      }
      document.getElementById("hint").textContent = m.hint;
      document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    }
    document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => show(b.dataset.mode)));
    show("claude");
  </script>
</body>
</html>
