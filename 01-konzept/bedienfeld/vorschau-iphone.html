<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedienfeld auf iPhone 13 mini</title>
<style>
  :root { --bg: #e9ebe6; --fg: #2a2c28; --muted: #62665e; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  p { margin: 0; color: var(--muted); text-align: center; max-width: 520px; }
  /* iPhone 13 mini: 375 × 812 Punkte, Gehäuse mit schmalem schwarzem Rand */
  .phone { position: relative; width: 375px; height: 812px; padding: 12px; border-radius: 52px;
           background: #0b0b0c; box-shadow: 0 0 0 2px #3a3b3e, 0 20px 50px rgba(0,0,0,.25); }
  .screen { position: relative; width: 375px; height: 812px; border-radius: 42px; overflow: hidden; background: #000; }
  iframe { width: 375px; height: 812px; border: 0; display: block; }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 32px;
           background: #0b0b0c; border-radius: 0 0 20px 20px; pointer-events: none; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px;
          border-radius: 3px; background: rgba(0,0,0,.55); pointer-events: none; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
</style>
</head>
<body>
  <h1>Bedienfeld auf dem iPhone 13 mini</h1>
  <p>375 × 812 Punkte im Vollbild, so wie es in der Box hängt. Notch und Home-Balken liegen über dem Inhalt.</p>
  <label><input type="checkbox" id="overlay" checked> Notch und Home-Balken zeigen</label>
  <div class="phone">
    <div class="screen">
      <iframe src="index.html" title="Bedienfeld"></iframe>
      <div class="notch" id="notch"></div>
      <div class="home" id="home"></div>
    </div>
  </div>
  <script>
    document.getElementById("overlay").addEventListener("change", e => {
      for (const id of ["notch", "home"]) document.getElementById(id).hidden = !e.target.checked;
    });
  </script>
</body>
</html>
