[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growbox"
version = "0.1.0"
description = "M-M Interaction: Software der Growbox auf dem Raspberry Pi (Server, Display, Demo-Panel)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# gpiozero bringt Raspberry Pi OS mit; ohne gpiozero wird die Hardware simuliert.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
growbox = ["web/**/*"]
