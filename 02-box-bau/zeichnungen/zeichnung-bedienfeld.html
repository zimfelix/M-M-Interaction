<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bedienfeld-Front Zeichnung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&display=swap">
<style>
html,body{margin:0;background:#ffffff}
svg{display:block;width:100%;max-width:1400px;height:auto;margin:0 auto}
text{font-family:'IBM Plex Sans Condensed',Arial Narrow,sans-serif;fill:#111}
.ln{fill:none;stroke:#111;stroke-width:2}
.thin{fill:none;stroke:#111;stroke-width:1}
.hid{fill:none;stroke:#111;stroke-width:1.2;stroke-dasharray:7 4}
.ctr{fill:none;stroke:#111;stroke-width:0.8;stroke-dasharray:14 3 2 3}
.dim{fill:none;stroke:#111;stroke-width:0.9}
.d{font-size:15px}
.lbl{font-size:14px}
.h{font-size:17px;font-weight:600}
</style>
</head>
<body>
<svg viewBox="0 0 1120 960" role="img" aria-label="Technische Zeichnung der 3D-gedruckten Bedienfeld-Front 85 mal 250 mal 10 Millimeter: Vorderansicht mit Tasche für das iPhone 13 mini, Sichtöffnung, Kerbe für den Lightning-Stecker und Loch für den Taster; Schnitt A-A; Maßtabellen">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 2 L10 5 L0 8 Z" fill="#111"></path></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="0.8"></line></pattern>
</defs>
<rect x="10" y="10" width="1100" height="940" class="thin"></rect>

<!-- ========== VORDERANSICHT (1 mm = 3 px) ========== -->
<text x="120" y="38" class="h">Vorderansicht</text>
<rect x="120" y="110" width="255" height="750" rx="6" class="ln"></rect>
<!-- Tasche 64,6 × 131,9, R10 (verdeckt) -->
<rect x="150.6" y="140" width="193.8" height="395.7" rx="30" class="hid"></rect>
<!-- Sichtöffnung 60,6 × 127,9, R8 -->
<rect x="156.6" y="146" width="181.8" height="383.7" rx="24" class="ln"></rect>
<!-- Lightning-Kerbe 14 × 8 -->
<path d="M226.5 535.7 L226.5 559.7 L268.5 559.7 L268.5 535.7" class="hid"></path>
<!-- Taster-Loch Ø30, Mitte 54 über Unterkante -->
<circle cx="247.5" cy="698" r="45" class="ln"></circle>
<path d="M237.5 698 L257.5 698 M247.5 688 L247.5 708" class="thin"></path>
<!-- Mittellinie / Schnitt A–A -->
<path d="M247.5 92 L247.5 878" class="ctr"></path>
<path d="M247.5 92 L277.5 92 M247.5 878 L277.5 878" class="ln" marker-end="url(#ar)"></path>
<text x="283" y="97" class="h">A</text>
<text x="283" y="883" class="h">A</text>

<!-- Maße oben -->
<path d="M120 106 L120 48 M375 106 L375 48" class="thin"></path>
<path d="M120 56 L375 56" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="247.5" y="51" class="d" text-anchor="middle">85</text>
<path d="M150.6 136 L150.6 70 M344.4 136 L344.4 70" class="thin"></path>
<path d="M150.6 78 L344.4 78" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="211" y="73" class="d" text-anchor="middle">64,6 Tasche</text>
<path d="M156.6 338 L338.4 338" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="247.5" y="331" class="d" text-anchor="middle">60,6 Sichtöffnung</text>
<!-- Rahmen links -->
<path d="M120 300 L150.6 300" class="dim"></path>
<path d="M60 300 L110 300" class="thin"></path>
<text x="114" y="296" class="d" text-anchor="end">10,2</text>
<!-- Radien -->
<path d="M175 160 L135 210 L22 210" class="thin"></path>
<text x="22" y="205" class="lbl">R 8 Öffnung</text>
<path d="M161 152 L127 178 L22 178" class="thin"></path>
<text x="22" y="173" class="lbl">R 10 Tasche</text>

<!-- Maße rechts -->
<path d="M379 110 L462 110 M348 140 L422 140 M348 535.7 L422 535.7 M379 860 L462 860" class="thin"></path>
<path d="M414 110 L414 140" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="422" y="130" class="d">10</text>
<path d="M414 140 L414 535.7" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="422" y="342" class="d">131,9 Tasche</text>
<path d="M414 535.7 L414 860" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="422" y="702" class="d">108,1</text>
<path d="M456 110 L456 860" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="462" y="490" class="d">250</text>
<!-- Taster-Höhe -->
<path d="M205 698 L70 698 M116 860 L70 860" class="thin"></path>
<path d="M78 698 L78 860" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="72" y="784" class="d" text-anchor="end">54</text>
<!-- Hinweise -->
<path d="M279 666 L310 660 L392 660" class="thin"></path>
<text x="314" y="655" class="lbl">Ø 30 Taster</text>
<path d="M268.5 552 L310 552 L392 552" class="thin"></path>
<text x="314" y="547" class="lbl">Kerbe 14 × 8</text>

<!-- ========== SCHNITT A–A ========== -->
<text x="530" y="38" class="h">Schnitt A–A</text>
<g fill="url(#hatch)" stroke="#111" stroke-width="2">
<rect x="530" y="110" width="30" height="30"></rect>
<rect x="530" y="140" width="6" height="6"></rect>
<rect x="530" y="529.7" width="6" height="6"></rect>
<rect x="530" y="559.7" width="30" height="93.3"></rect>
<rect x="530" y="743" width="30" height="117"></rect>
</g>
<rect x="536.6" y="140.6" width="22.9" height="394.5" rx="4" fill="#d9d9d9" stroke="#111" stroke-width="1.2"></rect>
<text x="548" y="340" class="lbl" text-anchor="middle" transform="rotate(-90 548 340)">iPhone 13 mini</text>
<path d="M530 535.7 L530 559.7 M560 535.7 L560 559.7" class="hid"></path>
<path d="M530 653 L530 743 M560 653 L560 743" class="hid"></path>
<path d="M530 106 L530 48 M536 106 L536 70 M560 106 L560 48" class="thin"></path>
<path d="M530 56 L560 56" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="570" y="61" class="d">10</text>
<path d="M510 78 L530 78" class="dim" marker-end="url(#ar)"></path>
<path d="M556 78 L536 78" class="dim" marker-end="url(#ar)"></path>
<text x="490" y="83" class="d">2</text>
<path d="M536 78 L560 78" class="dim" marker-start="url(#ar)" marker-end="url(#ar)"></path>
<text x="570" y="83" class="d">8 Tasche</text>
<text x="518" y="134" class="lbl" text-anchor="end">vorn</text>
<path d="M610 150 L570 150 L534 143" class="thin"></path>
<text x="614" y="154" class="lbl">Lippe 2 mm hält das Handy vorn</text>
<path d="M610 230 L561 230" class="thin"></path>
<text x="614" y="234" class="lbl">hinten offen: Handy von hinten einsetzen,</text>
<text x="614" y="252" class="lbl">2 Klammern oder Rückwand halten es</text>
<path d="M610 548 L562 548" class="thin"></path>
<text x="614" y="552" class="lbl">Kerbe für Lightning-Winkelstecker</text>
<path d="M610 698 L562 698" class="thin"></path>
<text x="614" y="702" class="lbl">Loch für Taster, durchgehend</text>

<!-- ========== TABELLEN ========== -->
<g transform="translate(610 310)">
<text x="0" y="0" class="h">iPhone 13 mini, ohne Hülle (Apple-Zeichnung)</text>
<text x="0" y="24" class="d">Höhe</text><text x="250" y="24" class="d" text-anchor="end">131,50</text>
<text x="0" y="44" class="d">Breite</text><text x="250" y="44" class="d" text-anchor="end">64,21</text>
<text x="0" y="64" class="d">Dicke (ohne Kamerabuckel)</text><text x="250" y="64" class="d" text-anchor="end">7,65</text>
<text x="0" y="84" class="d">Sichtbarer Bildschirm</text><text x="250" y="84" class="d" text-anchor="end">57,67 × 124,96</text>
<text x="0" y="122" class="h">Daraus fürs Druckteil</text>
<text x="0" y="146" class="d">Tasche: +0,2 je Seite → 64,6 × 131,9 × 8 (Handy klemmt leicht)</text>
<text x="0" y="166" class="d">Rahmen seitlich: 10,2 → außen 85 breit</text>
<text x="0" y="186" class="d">Lippe vorn: 2 je Seite → Öffnung 60,6 × 127,9 (größer als Bildschirm)</text>
<text x="0" y="206" class="d">Seitentaste wird abgedeckt (kein versehentliches Ausschalten)</text>
</g>

<!-- Schriftfeld -->
<g transform="translate(600 810)">
<rect x="0" y="0" width="500" height="130" class="thin"></rect>
<path d="M0 44 L500 44 M0 88 L500 88 M250 44 L250 130" class="thin"></path>
<text x="14" y="30" class="h">Growbox · Bedienfeld-Front (3D-Druck)</text>
<text x="14" y="72" class="d">Außen 85 × 250 × 10 mm</text>
<text x="264" y="72" class="d">Maße in mm · Toleranz ±0,2</text>
<text x="14" y="116" class="d">PETG, hellbraun wie Technikraum</text>
<text x="264" y="116" class="d">250 von 255 mm Druckbett: knapp</text>
</g>
</svg>
</body>
</html>
