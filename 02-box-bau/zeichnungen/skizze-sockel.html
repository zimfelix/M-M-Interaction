<text x="40" y="90" font-size="23" fill="#6b665d">Erde liegt nur in Plexi · Sockel und Rahmen gedruckt (PETG, schimmelt nicht)</text>

<text x="566" y="442" font-size="21" fill="#6b665d">Nut hält die Plexi-Wände</text>
