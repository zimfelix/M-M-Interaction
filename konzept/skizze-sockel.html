<!-- Text -->
<g font-family="Caveat, cursive" fill="#22211f">
<text x="40" y="58" font-size="46" font-weight="700">Growbox · Sockel</text>
<text x="40" y="90" font-size="23" fill="#6b665d">Erde liegt nur in Plexi · Holz bleibt außen und trocken</text>

<text x="566" y="196" font-size="25">3 · Plexi-Wanne</text>
<text x="566" y="220" font-size="21" fill="#6b665d">Boden + Wände aus Plexi,</text>

<text x="566" y="396" font-size="25">2 · Holzrahmen 5 cm</text>
<text x="566" y="420" font-size="21" fill="#6b665d">verdeckt die Erde,</text>
<text x="566" y="442" font-size="21" fill="#6b665d">Nut hält die Plexi-Wände</text>
<text x="566" y="536" font-size="25">1 · Holzboden</text>
<text x="566" y="560" font-size="21" fill="#6b665d">trägt alles</text>

<text x="660" y="250" font-size="27" font-weight="700">Schnitt vorn unten</text>
<text x="660" y="276" font-size="21" fill="#6b665d">vorn = links</text>
<text x="784" y="416" font-size="22">Plexi-Tür</text>
<text x="784" y="438" font-size="19" fill="#6b665d">steht auf dem Rahmen</text>
<text x="784" y="472" font-size="22">Plexi-Schwelle</text>
<text x="784" y="494" font-size="19" fill="#6b665d">hält Erde beim Öffnen drin</text>
<text x="1040" y="466" font-size="22" text-anchor="end">Nut</text>
<text x="640" y="550" font-size="20" text-anchor="end">5 cm</text>
<text x="700" y="678" font-size="22">Plexi-Boden</text>
<text x="700" y="700" font-size="19" fill="#6b665d">Erde berührt kein Holz</text>
<text x="900" y="684" font-size="22">Holz außen</text>
<text x="900" y="706" font-size="19" fill="#6b665d">trocken, kein Schimmel</text>
