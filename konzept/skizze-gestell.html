<text x="40" y="90" font-size="23" fill="#6b665d">Prinzip wie beim Creality K2 Plus: Profile + Eckstücke, Scheiben stecken in Nuten · Profile vereinfacht gezeichnet</text>
<text x="40" y="138" font-size="24">Eckstück, rund</text>

<text x="230" y="116" font-size="24">T-Stück: hier stoßen Pilzkammer und Technikraum zusammen</text>
